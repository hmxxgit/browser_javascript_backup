<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatGPT Custom UI 手动回归</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, sans-serif; background: #f7f7f8; color: #171717; }
        aside { position: fixed; inset: 0 auto 0 0; width: 230px; padding: 18px; overflow: auto; background: #ececf1; }
        aside .filler { height: 1300px; }
        main { margin-left: 230px; min-height: 100vh; }
        .thread-scroll-container { height: calc(100vh - 120px); overflow-y: auto; padding: 32px 80px 180px; }
        .message { min-height: 1500px; max-width: 760px; margin: auto; line-height: 1.7; }
        #dock { position: fixed; left: 230px; right: 0; bottom: 0; height: 110px; padding: 12px 15%; background: rgba(247,247,248,.95); }
        form { width: 100%; height: 82px; padding: 14px; border: 1px solid #aaa; border-radius: 18px; background: white; }
        textarea { width: calc(100% - 90px); height: 48px; }
        #portal { position: fixed; top: 72px; right: 40px; z-index: 50; padding: 10px; border: 1px solid #999; background: white; }
        #scroll-button { position: fixed; right: 42px; bottom: 135px; width: 44px; height: 44px; border-radius: 50%; }
        #test-controls { position: fixed; top: 12px; left: 250px; z-index: 60; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; background: #111; color: white; font-size: 13px; }
    </style>
    <script>history.replaceState({}, "", "/c/manual-regression");</script>
</head>
<body>
    <aside id="sidebar">
        <strong>侧边栏滚动区</strong>
        <p>在这里滚动不应唤出对话箭头。</p>
        <div class="filler"></div>
    </aside>
    <main>
        <div class="thread-scroll-container">
            <article class="message" data-message-author-role="assistant">
                <h1>浏览器手动回归页面</h1>
                <p>将鼠标移到底部会显示输入框；点击正文后应隐藏。</p>
                <p id="exact-disclaimer">ChatGPT can make mistakes. Check important info.</p>
                <p>上面那句位于消息正文中，必须保持可见。</p>
            </article>
        </div>
        <div id="dock">
            <form data-composer-placement="thread" data-chatgpt-composer>
                <textarea id="prompt-textarea" aria-label="Prompt"></textarea>
                <button type="button">Send</button>
            </form>
        </div>
        <button id="scroll-button" aria-label="Scroll to bottom">↓</button>
    </main>
    <div id="portal" role="menu"><button id="menu-item">模型菜单项</button></div>
    <div id="test-controls">
        <button id="show-composer" type="button">模拟底部悬停</button>
        <output id="status">加载中…</output>
    </div>
    <script src="/chatgpt-custom-ui.user.js"></script>
    <script>
        const status = document.querySelector('#status');
        const refreshStatus = () => {
            const button = document.querySelector('#scroll-button');
            status.textContent = [
                `composer: ${document.body.classList.contains('tm-chatgpt-composer-visible') ? '显示' : '隐藏'}`,
                `focusable: ${document.querySelector('form').hasAttribute('inert') ? '否' : '是'}`,
                `arrow: ${button.classList.contains('tm-scroll-bottom-visible') ? (button.dataset.tmScrollDirection || '显示') : '隐藏'}`
            ].join(' ｜ ');
        };
        new MutationObserver(refreshStatus).observe(document.body, { attributes: true, subtree: true });
        document.addEventListener('pointerdown', () => setTimeout(refreshStatus));
        document.addEventListener('wheel', () => setTimeout(refreshStatus));
        document.addEventListener('mousemove', refreshStatus);
        document.querySelector('#show-composer').addEventListener('click', () => {
            document.dispatchEvent(new MouseEvent('mousemove', {
                bubbles: true,
                clientY: 0
            }));
            document.dispatchEvent(new MouseEvent('mousemove', {
                bubbles: true,
                clientY: window.innerHeight - 1
            }));
        });
        setInterval(refreshStatus, 250);
        refreshStatus();
    </script>
</body>
</html>
