name: Test userscripts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --check chatgpt-custom-ui.user.js
      - run: node --check youtube-default-quality.user.js
      - run: node --check x-custom-ui.user.js
      - run: npm test
